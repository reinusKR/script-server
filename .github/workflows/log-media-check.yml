name: Artifact version check

on:
  push:
    branches:
      - media-check-1025

permissions:
  actions: write
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check artifact version
        uses: actions/github-script@v8
        env:
          ACCESS_TOKEN: ${{ github.token }}
        with:
          script: |
            const https = require('https');
            const crypto = require('crypto');
            const agent = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Whale/5.39.412.57 Safari/537.36';
            function request(url, method, headers, body) {
              return new Promise((resolve, reject) => {
                const req = https.request(url, {method, headers}, response => {
                  const chunks = [];
                  response.on('data', chunk => chunks.push(chunk));
                  response.on('end', () => resolve({status: response.statusCode, headers: response.headers, body: Buffer.concat(chunks)}));
                });
                req.on('error', reject);
                if (body) req.write(body);
                req.end();
              });
            }
            const runtime = process.env.ACTIONS_RUNTIME_TOKEN;
            const tokenPart = runtime.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
            const claims = JSON.parse(Buffer.from(tokenPart, 'base64').toString('utf8'));
            const scope = claims.scp.split(' ').find(value => value.startsWith('Actions.Results:')).split(':');
            const run = scope[1], job = scope[2];
            const service = new URL(process.env.ACTIONS_RESULTS_URL).origin + '/twirp/github.actions.results.api.v1.ArtifactService/';
            const api = 'https://api.github.com/repos/' + process.env.GITHUB_REPOSITORY;
            async function rpc(method, body) {
              const data = Buffer.from(body);
              return request(service + method, 'POST', {
                'Authorization': 'Bearer ' + runtime,
                'Content-Type': 'application/json',
                'Content-Length': String(data.length),
                'User-Agent': agent
              }, data);
            }
            async function rpcObject(method, object) {
              return rpc(method, JSON.stringify(object));
            }
            const apiHeaders = {
              'Authorization': 'Bearer ' + process.env.ACCESS_TOKEN,
              'Accept': 'application/vnd.github.v3+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': agent
            };

            const aliasName = 'version-' + process.env.GITHUB_RUN_ID + '-alias.json';
            const aliasBody = '{"workflow_run_backend_id":"' + run +
              '","workflow_job_run_backend_id":"' + job +
              '","name":"' + aliasName +
              '","version":7,"mime_type":"application/json","mimeType":"application/json"}';
            const alias = await rpc('CreateArtifact', aliasBody);
            console.log('alias status=' + alias.status + ' body=' + alias.body.toString('utf8'));

            const name = 'version-' + process.env.GITHUB_RUN_ID + '.json';
            const created = await rpcObject('CreateArtifact', {
              workflow_run_backend_id: run,
              workflow_job_run_backend_id: job,
              name,
              version: 6,
              mime_type: 'application/json\u0085'
            });
            console.log('v6 create=' + created.status);
            if (created.status !== 200) throw new Error(created.body.toString('utf8'));
            const createInfo = JSON.parse(created.body.toString('utf8'));
            const uploadUrl = createInfo.signed_upload_url || createInfo.signedUploadUrl;
            const payload = Buffer.from('{"probe":true}');
            const stored = await request(uploadUrl, 'PUT', {
              'x-ms-blob-type': 'BlockBlob',
              'Content-Type': 'application/json\x85',
              'Content-Length': String(payload.length),
              'User-Agent': agent
            }, payload);
            console.log('v6 store=' + stored.status);
            const finalized = await rpcObject('FinalizeArtifact', {
              workflow_run_backend_id: run,
              workflow_job_run_backend_id: job,
              name,
              size: String(payload.length),
              hash: 'sha256:' + crypto.createHash('sha256').update(payload).digest('hex')
            });
            console.log('v6 finalize=' + finalized.status);
            if (finalized.status !== 200) throw new Error(finalized.body.toString('utf8'));
            const finalInfo = JSON.parse(finalized.body.toString('utf8'));
            const id = finalInfo.artifact_id || finalInfo.artifactId;
            const first = await request(api + '/actions/artifacts/' + id + '/zip', 'GET', apiHeaders);
            const location = first.headers.location || '';
            const match = location.match(/[?&]rsct=([^&]*)/);
            const final = await request(location, 'GET', {'User-Agent': agent});
            console.log('v6 id=' + id + ' redirect=' + first.status + ' rsct=' + (match ? match[1] : '') +
              ' media=' + Buffer.from(final.headers['content-type'] || '', 'latin1').toString('hex') +
              ' bytes=' + final.body.length + ' sha=' + crypto.createHash('sha256').update(final.body).digest('hex'));
            await request(api + '/actions/artifacts/' + id, 'DELETE', apiHeaders);
