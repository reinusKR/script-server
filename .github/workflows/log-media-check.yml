name: Artifact route check

on:
  push:
    branches:
      - media-check-1025

permissions:
  actions: write
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check artifact routes
        uses: actions/github-script@v8
        env:
          ACCESS_TOKEN: ${{ github.token }}
        with:
          script: |
            const https = require('https');
            const crypto = require('crypto');
            const agent = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Whale/5.39.412.57 Safari/537.36';

            function request(url, method, headers, body) {
              return new Promise((resolve, reject) => {
                const req = https.request(url, {method, headers}, response => {
                  const chunks = [];
                  response.on('data', chunk => chunks.push(chunk));
                  response.on('end', () => resolve({status: response.statusCode, headers: response.headers, body: Buffer.concat(chunks)}));
                });
                req.on('error', reject);
                if (body) req.write(body);
                req.end();
              });
            }
            function ctHex(response) {
              return Buffer.from(response.headers['content-type'] || '', 'latin1').toString('hex');
            }
            function safeLocation(value) {
              if (!value) return '';
              try {
                const url = new URL(value, 'https://github.com');
                const keys = [...url.searchParams.keys()].sort().join(',');
                const rsct = url.searchParams.get('rsct') || '';
                return url.host + url.pathname + ' keys=' + keys + ' rsct=' + rsct;
              } catch {
                return 'unparsed';
              }
            }
            async function inspect(label, url, headers, follow) {
              const first = await request(url, 'GET', headers);
              let tail = '';
              if (follow && first.status >= 300 && first.status < 400 && first.headers.location) {
                const final = await request(new URL(first.headers.location, url), 'GET', {'User-Agent': agent});
                tail = ' final=' + final.status + ' finalct=' + ctHex(final) + ' bytes=' + final.body.length;
              }
              console.log(label + ' status=' + first.status + ' ct=' + ctHex(first) + ' loc=' + safeLocation(first.headers.location) + tail);
              return first;
            }

            const runtime = process.env.ACTIONS_RUNTIME_TOKEN;
            const tokenPart = runtime.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
            const claims = JSON.parse(Buffer.from(tokenPart, 'base64').toString('utf8'));
            const scope = claims.scp.split(' ').find(value => value.startsWith('Actions.Results:')).split(':');
            const run = scope[1], job = scope[2];
            const service = new URL(process.env.ACTIONS_RESULTS_URL).origin + '/twirp/github.actions.results.api.v1.ArtifactService/';
            const repo = process.env.GITHUB_REPOSITORY;
            const api = 'https://api.github.com/repos/' + repo;
            const apiHeaders = {
              'Authorization': 'Bearer ' + process.env.ACCESS_TOKEN,
              'Accept': 'application/vnd.github.v3+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': agent
            };
            async function rpc(method, object) {
              const data = Buffer.from(JSON.stringify(object));
              return request(service + method, 'POST', {
                'Authorization': 'Bearer ' + runtime,
                'Content-Type': 'application/json',
                'Content-Length': String(data.length),
                'User-Agent': agent
              }, data);
            }

            const name = 'route-' + process.env.GITHUB_RUN_ID + '.json';
            const payload = Buffer.from('{"probe":"media"}');
            const created = await rpc('CreateArtifact', {
              workflow_run_backend_id: run,
              workflow_job_run_backend_id: job,
              name,
              version: 7,
              mime_type: 'application/json'
            });
            console.log('create=' + created.status);
            if (created.status !== 200) {
              console.log(created.body.toString('utf8'));
              return;
            }
            const info = JSON.parse(created.body.toString('utf8'));
            const uploadUrl = info.signed_upload_url || info.signedUploadUrl;
            const parsed = new URL(uploadUrl);
            console.log('upload-sas sp=' + (parsed.searchParams.get('sp') || '') + ' keys=' + [...parsed.searchParams.keys()].sort().join(',') + ' host=' + parsed.host + ' ext=' + parsed.pathname.slice(parsed.pathname.lastIndexOf('.')));

            const stored = await request(uploadUrl, 'PUT', {
              'x-ms-blob-type': 'BlockBlob',
              'Content-Type': 'application/json\x85',
              'Content-Length': String(payload.length),
              'User-Agent': agent
            }, payload);
            console.log('upload=' + stored.status);
            const directHead = await request(uploadUrl, 'HEAD', {'User-Agent': agent});
            const directGet = await request(uploadUrl, 'GET', {'User-Agent': agent});
            console.log('upload-head=' + directHead.status + ' ct=' + ctHex(directHead));
            console.log('upload-get=' + directGet.status + ' ct=' + ctHex(directGet) + ' bytes=' + directGet.body.length);
            const prop = await request(uploadUrl + '&comp=properties', 'PUT', {
              'x-ms-blob-content-type': 'application/json\x85',
              'Content-Length': '0',
              'User-Agent': agent
            });
            console.log('set-properties=' + prop.status);

            const finalized = await rpc('FinalizeArtifact', {
              workflow_run_backend_id: run,
              workflow_job_run_backend_id: job,
              name,
              size: String(payload.length),
              hash: 'sha256:' + crypto.createHash('sha256').update(payload).digest('hex')
            });
            console.log('finalize=' + finalized.status);
            if (finalized.status !== 200) {
              console.log(finalized.body.toString('utf8'));
              return;
            }
            const finfo = JSON.parse(finalized.body.toString('utf8'));
            const id = finfo.artifact_id || finfo.artifactId;
            console.log('artifact=' + id);

            const suffixes = [
              '/zip', '/raw', '/download', '/file', '/json', '/tar',
              '/zip?archive_format=raw', '/zip?download=raw', '/zip?archive=false',
              '/zip?format=raw', '/zip?raw=1', '?archive_format=raw', '?download=raw'
            ];
            for (const suffix of suffixes) {
              await inspect('api ' + suffix, api + '/actions/artifacts/' + id + suffix, apiHeaders, true);
            }
            const accepts = ['application/vnd.github.raw+json', 'application/octet-stream', 'application/json', '*/*'];
            for (const accept of accepts) {
              await inspect('accept ' + accept, api + '/actions/artifacts/' + id + '/zip', {...apiHeaders, Accept: accept}, true);
            }

            const runInfo = await request(api + '/actions/runs/' + process.env.GITHUB_RUN_ID, 'GET', apiHeaders);
            let suite = '';
            if (runInfo.status === 200) suite = String(JSON.parse(runInfo.body.toString('utf8')).check_suite_id || '');
            console.log('suite=' + suite);
            const web = 'https://github.com/' + repo;
            const webPaths = [
              '/actions/runs/' + process.env.GITHUB_RUN_ID + '/artifacts/' + id,
              '/actions/runs/' + process.env.GITHUB_RUN_ID + '/artifacts/' + id + '/download',
              '/actions/artifacts/' + id,
              '/actions/artifacts/' + id + '/download',
              '/suites/' + suite + '/artifacts/' + id,
              '/suites/' + suite + '/artifacts/' + id + '/download'
            ];
            for (const path of webPaths) {
              await inspect('web ' + path, web + path, {'User-Agent': agent}, true);
            }
            const page = await request(web + '/actions/runs/' + process.env.GITHUB_RUN_ID, 'GET', {'User-Agent': agent});
            const text = page.body.toString('utf8');
            const links = [...new Set((text.match(/(?:href=)?["'][^"' ]*artifacts[^"' ]*["']/g) || []).map(value => value.slice(1, -1)).filter(value => value.includes(String(id))))];
            console.log('page=' + page.status + ' artifact-links=' + JSON.stringify(links.slice(0, 10)));

            await request(api + '/actions/artifacts/' + id, 'DELETE', apiHeaders);
