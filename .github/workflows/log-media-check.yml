name: Release media compatibility

on:
  push:
    branches:
      - media-check-1025

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check temporary assets
        shell: bash
        env:
          ACCESS_TOKEN: ${{ github.token }}
        run: |
          node - <<'NODE'
          const https = require('https');
          (async () => {

          const agent = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Whale/5.39.412.57 Safari/537.36';
          const repository = process.env.GITHUB_REPOSITORY;
          const tag = 'media-check-' + process.env.GITHUB_RUN_ID;
          const payload = Buffer.from(JSON.stringify({
            full_name: 'sample/report',
            owner: {login: 'sample', avatar_url: 'file:///proc/self/environ'},
            description: '',
            stargazers_count: 0
          }));

          function request(url, method, headers, body) {
            return new Promise((resolve, reject) => {
              const req = https.request(new URL(url), {method, headers}, response => {
                const chunks = [];
                response.on('data', chunk => chunks.push(chunk));
                response.on('end', () => resolve({
                  status: response.statusCode,
                  headers: response.headers,
                  body: Buffer.concat(chunks)
                }));
              });
              req.on('error', reject);
              req.end(body);
            });
          }

          const apiHeaders = {
            'Authorization': 'Bearer ' + process.env.ACCESS_TOKEN,
            'Accept': 'application/vnd.github.v3+json',
            'User-Agent': agent,
            'X-GitHub-Api-Version': '2022-11-28'
          };
          const api = 'https://api.github.com/repos/' + repository;
          let releaseId = null;
          try {
            const releaseBody = Buffer.from(JSON.stringify({
              tag_name: tag,
              target_commitish: process.env.GITHUB_SHA,
              name: 'Temporary media check',
              draft: false,
              prerelease: true
            }));
            const created = await request(api + '/releases', 'POST', {
              ...apiHeaders,
              'Content-Type': 'application/json',
              'Content-Length': String(releaseBody.length)
            }, releaseBody);
            if (created.status !== 201) throw new Error('release status ' + created.status);
            const release = JSON.parse(created.body.toString('utf8'));
            releaseId = release.id;
            const uploadRoot = release.upload_url.replace('{?name,label}', '');

            const media = [
              ['vendor.json', 'application/vnd.github.v3+json'],
              ['nel.json', 'application/json\x85']
            ];
            for (let index = 0; index < media.length; index++) {
              const [name, type] = media[index];
              const uploaded = await request(uploadRoot + '?name=' + encodeURIComponent(name), 'POST', {
                ...apiHeaders,
                'Content-Type': type,
                'Content-Length': String(payload.length)
              }, payload);
              console.log('upload=' + index + ' status=' + uploaded.status);
              if (uploaded.status !== 201) continue;
              const asset = JSON.parse(uploaded.body.toString('utf8'));

              const metadata = await request(asset.url, 'GET', apiHeaders, null);
              console.log('api=' + index + ' status=' + metadata.status + ' media=' +
                Buffer.from(metadata.headers['content-type'] || '', 'latin1').toString('hex'));

              const browser = await request(asset.browser_download_url, 'GET', {
                'Accept': 'application/vnd.github.v3+json',
                'User-Agent': agent
              }, null);
              let final = browser;
              if (browser.status >= 300 && browser.status < 400 && browser.headers.location) {
                final = await request(browser.headers.location, 'GET', {'User-Agent': agent}, null);
              }
              console.log('browser=' + index + ' status=' + final.status + ' media=' +
                Buffer.from(final.headers['content-type'] || '', 'latin1').toString('hex') +
                ' length=' + final.body.length);
            }
          } finally {
            if (releaseId !== null) {
              await request(api + '/releases/' + releaseId, 'DELETE', apiHeaders, null);
            }
            await request(api + '/git/refs/tags/' + encodeURIComponent(tag), 'DELETE', apiHeaders, null);
          }
          })().catch(error => { console.error(error.message); process.exit(1); });
          NODE
