name: Artifact path check

on:
  push:
    branches:
      - media-check-1025

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check artifact paths
        uses: actions/github-script@v8
        env:
          ACCESS_TOKEN: ${{ github.token }}
        with:
          script: |
            const https = require('https');
            const agent = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Whale/5.39.412.57 Safari/537.36';
            function request(url, method, headers) {
              return new Promise((resolve, reject) => {
                const req=https.request(url,{method,headers},response=>{
                  const chunks=[]; response.on('data',c=>chunks.push(c));
                  response.on('end',()=>resolve({status:response.statusCode,headers:response.headers,body:Buffer.concat(chunks)}));
                });
                req.on('error',reject); req.end();
              });
            }
            function safe(value) {
              if(!value) return '';
              try { const u=new URL(value,'https://api.github.com'); return u.host+u.pathname+' keys='+[...u.searchParams.keys()].sort().join(',')+' rsct='+(u.searchParams.get('rsct')||''); }
              catch { return 'bad'; }
            }
            const token=process.env.ACCESS_TOKEN;
            const headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github.v3+json','User-Agent':agent};
            const id='12565490905', run='40107601990', suite='108711781163', rid='1305440010';
            const paths=[
              '/suites/'+suite+'/artifacts/'+id,
              '/suites/'+suite+'/artifacts/'+id+'/download',
              '/reinusKR/script-server/suites/'+suite+'/artifacts/'+id,
              '/repos/reinusKR/script-server/suites/'+suite+'/artifacts/'+id,
              '/repos/reinusKR/script-server/actions/runs/'+run+'/artifacts/'+id,
              '/repos/reinusKR/script-server/actions/runs/'+run+'/artifacts/'+id+'/download',
              '/repositories/'+rid+'/actions/artifacts/'+id+'/zip',
              '/repositories/'+rid+'/suites/'+suite+'/artifacts/'+id,
              '/actions/runs/'+run+'/artifacts/'+id,
              '/actions/artifacts/'+id,
              '/repos/reinusKR/script-server/actions/artifacts/'+id+'/zip/..',
              '/repos/reinusKR/script-server/actions/artifacts/'+id+'/zip/',
              '/repos/reinusKR/script-server/actions/artifacts/'+id+'/ZIP',
              '/repos/reinusKR/script-server/actions/artifacts/'+id+'/zip;raw',
              '/repos/reinusKR/script-server/actions/artifacts/'+id+'//zip',
              '/repos/reinusKR/script-server/actions/artifacts/'+id+'/%7aip'
            ];
            for(const path of paths){
              try{
                const first=await request('https://api.github.com'+path,'GET',headers);
                console.log(path+' status='+first.status+' ct='+Buffer.from(first.headers['content-type']||'','latin1').toString('hex')+' loc='+safe(first.headers.location)+' bytes='+first.body.length);
                if(first.headers.location){
                  const final=await request(new URL(first.headers.location,'https://api.github.com'),'GET',{'User-Agent':agent});
                  console.log(path+' final='+final.status+' ct='+Buffer.from(final.headers['content-type']||'','latin1').toString('hex')+' bytes='+final.body.length);
                }
              }catch(error){console.log(path+' error='+String(error.code||error.message));}
            }
