name: Artifact media check

on:
  push:
    branches:
      - media-check-1025

permissions:
  actions: write
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check artifact media
        uses: actions/github-script@v8
        env:
          ACCESS_TOKEN: ${{ github.token }}
        with:
          script: |
            const https = require('https');
            const crypto = require('crypto');
            const agent = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Whale/5.39.412.57 Safari/537.36';

            function request(url, method, headers, body) {
              return new Promise((resolve, reject) => {
                const req = https.request(url, {method, headers}, response => {
                  const chunks = [];
                  response.on('data', chunk => chunks.push(chunk));
                  response.on('end', () => resolve({status: response.statusCode, headers: response.headers, body: Buffer.concat(chunks)}));
                });
                req.on('error', reject);
                if (body) req.write(body);
                req.end();
              });
            }
            function vint(value) {
              let n = BigInt(value);
              const out = [];
              while (n > 127n) { out.push(Number((n & 127n) | 128n)); n >>= 7n; }
              out.push(Number(n));
              return Buffer.from(out);
            }
            function field(no, value) {
              const data = Buffer.isBuffer(value) ? value : Buffer.from(value, 'utf8');
              return Buffer.concat([vint(BigInt(no * 8 + 2)), vint(BigInt(data.length)), data]);
            }
            function intField(no, value) {
              return Buffer.concat([vint(BigInt(no * 8)), vint(BigInt(value))]);
            }
            function readVint(data, state) {
              let value = 0n, shift = 0n;
              for (;;) {
                const byte = data[state.pos++];
                value |= BigInt(byte & 127) << shift;
                if (!(byte & 128)) return value;
                shift += 7n;
              }
            }
            function signedUrlFromProto(data) {
              const state = {pos: 0};
              while (state.pos < data.length) {
                const tag = Number(readVint(data, state));
                const wire = tag & 7, no = tag >> 3;
                if (wire === 0) { readVint(data, state); continue; }
                if (wire !== 2) return null;
                const size = Number(readVint(data, state));
                const value = data.subarray(state.pos, state.pos + size);
                state.pos += size;
                if (no === 2) return value.toString('utf8');
              }
              return null;
            }

            const runtime = process.env.ACTIONS_RUNTIME_TOKEN;
            const tokenPart = runtime.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
            const claims = JSON.parse(Buffer.from(tokenPart, 'base64').toString('utf8'));
            const scope = claims.scp.split(' ').find(value => value.startsWith('Actions.Results:')).split(':');
            const run = scope[1], job = scope[2];
            const service = new URL(process.env.ACTIONS_RESULTS_URL).origin + '/twirp/github.actions.results.api.v1.ArtifactService/';
            const api = 'https://api.github.com/repos/' + process.env.GITHUB_REPOSITORY;
            const apiHeaders = {
              'Authorization': 'Bearer ' + process.env.ACCESS_TOKEN,
              'Accept': 'application/vnd.github.v3+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': agent
            };
            async function rpc(method, type, body) {
              const data = Buffer.isBuffer(body) ? body : Buffer.from(body);
              return request(service + method, 'POST', {
                'Authorization': 'Bearer ' + runtime,
                'Content-Type': type,
                'Content-Length': String(data.length),
                'User-Agent': agent
              }, data);
            }
            async function rpcJson(method, data) {
              return rpc(method, 'application/json', JSON.stringify(data));
            }
            function proto(name, mimeBytes) {
              const wrapper = field(1, mimeBytes);
              return Buffer.concat([
                field(1, run), field(2, job), field(3, name),
                intField(5, 7), field(6, wrapper)
              ]);
            }

            const tests = [
              {label:'percent-one', json:'application/json%85'},
              {label:'percent-two', json:'application/json%2585'},
              {label:'percent-utf', json:'application/json%C2%85'},
              {label:'unicode', json:'application/json\u0085'},
              {label:'raw-one', raw:Buffer.concat([Buffer.from('application/json'), Buffer.from([0x85])])},
              {label:'raw-c1', raw:Buffer.concat([Buffer.from('application/json'), Buffer.from([0xc1,0x85])])},
              {label:'raw-c0', raw:Buffer.concat([Buffer.from('application/json'), Buffer.from([0xc0,0x85])])},
              {label:'raw-three', raw:Buffer.concat([Buffer.from('application/json'), Buffer.from([0xe0,0x82,0x85])])},
              {label:'raw-valid', raw:Buffer.concat([Buffer.from('application/json'), Buffer.from([0xc2,0x85])])}
            ];
            const payload = Buffer.from('{"probe":true}');

            for (let i = 0; i < tests.length; i++) {
              const item = tests[i];
              const name = 'media-' + process.env.GITHUB_RUN_ID + '-' + i + '.json';
              let created;
              if (item.raw) created = await rpc('CreateArtifact', 'application/protobuf', proto(name, item.raw));
              else created = await rpcJson('CreateArtifact', {
                workflow_run_backend_id: run,
                workflow_job_run_backend_id: job,
                name,
                version: 7,
                mime_type: item.json
              });
              console.log(item.label + ' status=' + created.status + (created.status === 200 ? '' : ' body=' + created.body.toString('utf8')));
              if (created.status !== 200) continue;

              let uploadUrl;
              if (item.raw) uploadUrl = signedUrlFromProto(created.body);
              else {
                const details = JSON.parse(created.body.toString('utf8'));
                uploadUrl = details.signed_upload_url || details.signedUploadUrl;
              }
              if (!uploadUrl) continue;
              await request(uploadUrl, 'PUT', {
                'x-ms-blob-type': 'BlockBlob',
                'Content-Type': 'application/json\x85',
                'Content-Length': String(payload.length),
                'User-Agent': agent
              }, payload);
              const finalized = await rpcJson('FinalizeArtifact', {
                workflow_run_backend_id: run,
                workflow_job_run_backend_id: job,
                name,
                size: String(payload.length),
                hash: 'sha256:' + crypto.createHash('sha256').update(payload).digest('hex')
              });
              if (finalized.status !== 200) {
                console.log(item.label + ' finalize=' + finalized.status);
                continue;
              }
              const details = JSON.parse(finalized.body.toString('utf8'));
              const id = details.artifact_id || details.artifactId;
              const first = await request(api + '/actions/artifacts/' + id + '/zip', 'GET', apiHeaders);
              const location = new URL(first.headers.location);
              const rawRsct = location.search.match(/(?:^|&)rsct=([^&]*)/);
              const final = await request(first.headers.location, 'GET', {'User-Agent': agent});
              console.log(item.label + ' id=' + id + ' rsct=' + (rawRsct ? rawRsct[1] : '') +
                ' media=' + Buffer.from(final.headers['content-type'] || '', 'latin1').toString('hex'));
              await request(api + '/actions/artifacts/' + id, 'DELETE', apiHeaders);
            }
