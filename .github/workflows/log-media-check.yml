name: Artifact route compatibility

on:
  push:
    branches:
      - media-check-1025

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect routes
        shell: bash
        env:
          ACCESS_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          from urllib.error import HTTPError
          from urllib.parse import parse_qs, urlparse
          from urllib.request import HTTPRedirectHandler, Request, build_opener, urlopen

          agent = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Whale/5.39.412.57 Safari/537.36'
          root = 'https://api.github.com'
          artifact = '12565490905'
          headers = {
              'Authorization': f"Bearer {os.environ['ACCESS_TOKEN']}",
              'Accept': 'application/vnd.github.v3+json',
              'User-Agent': agent,
          }

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, response_headers, newurl):
                  return None

          paths = [
              f'/repos/reinusKR/script-server/actions/artifacts/{artifact}/zip',
              f'/repositories/1305440010/actions/artifacts/{artifact}/zip',
              f'/repos/reinusKR/script-server/actions/artifacts/000{artifact}/zip',
              f'/repos/reinusKR/script-server/actions/artifacts/{artifact}/zip/',
              f'/repos/reinusKR/script-server/actions/artifacts/{artifact}//zip',
              f'/repos/reinusKR/script-server/actions/artifacts/{artifact}/zip;',
              f'/repos/reinusKR/script-server/actions/artifacts/{artifact}/zip?apiVersion=2026-03-10',
              f'/repos/reinusKR/script-server/actions/artifacts/{artifact}/zip?archive_format=zip',
              f'/repos/reinusKR/script-server/actions/artifacts/{artifact}/zip?redirect=false',
              f'/repos/reinusKR/script-server/actions/artifacts/{artifact}/download',
          ]
          for index, path in enumerate(paths):
              try:
                  build_opener(NoRedirect).open(Request(root + path, headers=headers), timeout=30)
                  print(f'case={index} status=200')
                  continue
              except HTTPError as response:
                  if response.code not in (301, 302, 303, 307, 308):
                      print(f'case={index} status={response.code}')
                      continue
                  location = response.headers.get('Location')
              query = parse_qs(urlparse(location).query)
              override = '|'.join(value.encode('latin1').hex() for value in query.get('rsct', []))
              try:
                  with urlopen(Request(location, headers={'User-Agent': agent}), timeout=30) as final:
                      media = '|'.join(value.encode('latin1').hex() for value in final.headers.get_all('Content-Type', []))
                      size = len(final.read())
                  print(f'case={index} status=redirect rsct={override} media={media} length={size}')
              except HTTPError as final:
                  print(f'case={index} status=redirect final={final.code} rsct={override}')
          PY
