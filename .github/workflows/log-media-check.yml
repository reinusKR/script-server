name: Artifact response check

on:
  push:
    branches:
      - media-check-1025

permissions:
  actions: write
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check artifact responses
        uses: actions/github-script@v8
        env:
          ACCESS_TOKEN: ${{ github.token }}
        with:
          script: |
            const https = require('https');
            const crypto = require('crypto');
            const agent = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Whale/5.39.412.57 Safari/537.36';

            function request(url, method, headers, body) {
              return new Promise((resolve, reject) => {
                const req = https.request(url, {method, headers}, response => {
                  const chunks = [];
                  response.on('data', chunk => chunks.push(chunk));
                  response.on('end', () => resolve({
                    status: response.statusCode,
                    headers: response.headers,
                    body: Buffer.concat(chunks)
                  }));
                });
                req.on('error', reject);
                if (body) req.write(body);
                req.end();
              });
            }

            const runtime = process.env.ACTIONS_RUNTIME_TOKEN;
            const part = runtime.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
            const claims = JSON.parse(Buffer.from(part, 'base64').toString('utf8'));
            const scope = claims.scp.split(' ').find(value => value.startsWith('Actions.Results:')).split(':');
            const run = scope[1];
            const job = scope[2];
            const service = new URL(process.env.ACTIONS_RESULTS_URL).origin +
              '/twirp/github.actions.results.api.v1.ArtifactService/';
            const api = 'https://api.github.com/repos/' + process.env.GITHUB_REPOSITORY;
            const headers = {
              'Authorization': 'Bearer ' + runtime,
              'Content-Type': 'application/json',
              'User-Agent': agent
            };
            const apiHeaders = {
              'Authorization': 'Bearer ' + process.env.ACCESS_TOKEN,
              'Accept': 'application/vnd.github.v3+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': agent
            };

            async function rpc(method, data) {
              const body = Buffer.from(JSON.stringify(data));
              return request(service + method, 'POST', {
                ...headers,
                'Content-Length': String(body.length)
              }, body);
            }
            function safeLocation(value) {
              if (!value) return '';
              const u = new URL(value);
              const pairs = [];
              for (const [key, val] of u.searchParams) {
                if (key.toLowerCase() === 'sig') pairs.push(key + '=<redacted>');
                else if (key.toLowerCase() === 'rsct') pairs.push(key + '=' + Buffer.from(val, 'latin1').toString('hex'));
                else pairs.push(key);
              }
              return u.origin + u.pathname + '?' + pairs.join('&');
            }
            async function follow(label, url) {
              const response = await request(url, 'GET', {'User-Agent': agent});
              const media = Buffer.from(response.headers['content-type'] || '', 'latin1').toString('hex');
              console.log(label + ' status=' + response.status + ' media=' + media + ' bytes=' + response.body.length);
            }

            const badName = 'response-' + process.env.GITHUB_RUN_ID + '-bad.json';
            const invalid = await rpc('CreateArtifact', {
              workflow_run_backend_id: run,
              workflow_job_run_backend_id: job,
              name: badName,
              version: 7,
              mime_type: 'application/json\u0085'
            });
            console.log('invalid status=' + invalid.status + ' body=' + invalid.body.toString('utf8'));

            const name = 'response-' + process.env.GITHUB_RUN_ID + '.json';
            const created = await rpc('CreateArtifact', {
              workflow_run_backend_id: run,
              workflow_job_run_backend_id: job,
              name,
              version: 7,
              mime_type: 'application/json'
            });
            if (created.status !== 200) throw new Error('create ' + created.status);
            const createInfo = JSON.parse(created.body.toString('utf8'));
            const uploadUrl = createInfo.signed_upload_url || createInfo.signedUploadUrl;
            const payload = Buffer.from('{"probe":true}');
            const stored = await request(uploadUrl, 'PUT', {
              'x-ms-blob-type': 'BlockBlob',
              'Content-Type': 'application/json\x85',
              'Content-Length': String(payload.length),
              'User-Agent': agent
            }, payload);
            console.log('store status=' + stored.status);

            const finalized = await rpc('FinalizeArtifact', {
              workflow_run_backend_id: run,
              workflow_job_run_backend_id: job,
              name,
              size: String(payload.length),
              hash: 'sha256:' + crypto.createHash('sha256').update(payload).digest('hex')
            });
            if (finalized.status !== 200) throw new Error('finalize ' + finalized.status + ' ' + finalized.body.toString('utf8'));
            const finalInfo = JSON.parse(finalized.body.toString('utf8'));
            const id = finalInfo.artifact_id || finalInfo.artifactId;
            console.log('artifact id=' + id);

            const signed = await rpc('GetSignedArtifactURL', {
              workflow_run_backend_id: run,
              workflow_job_run_backend_id: job,
              name
            });
            console.log('internal status=' + signed.status);
            if (signed.status === 200) {
              const signedInfo = JSON.parse(signed.body.toString('utf8'));
              const internalUrl = signedInfo.signed_url || signedInfo.signedUrl;
              console.log('internal location=' + safeLocation(internalUrl));
              await follow('internal original', internalUrl);
              await follow('internal append same', internalUrl + '&rsct=application%2Fjson');
              await follow('internal append byte', internalUrl + '&rsct=application%2Fjson%85');
              const q = internalUrl.indexOf('?');
              await follow('internal prepend byte', internalUrl.slice(0, q + 1) + 'rsct=application%2Fjson%85&' + internalUrl.slice(q + 1));
            }

            const suffixes = [
              '',
              '?rsct=application%2Fjson%85',
              '?rsct=application%2Fjson&rsct=application%2Fjson%85',
              '?rsct=application%2Fjson%85&rsct=application%2Fjson',
              '?RSCT=application%2Fjson%85',
              '?response-content-type=application%2Fjson%85'
            ];
            for (let i = 0; i < suffixes.length; i++) {
              const first = await request(api + '/actions/artifacts/' + id + '/zip' + suffixes[i], 'GET', apiHeaders);
              console.log('api case=' + i + ' status=' + first.status + ' location=' + safeLocation(first.headers.location));
              if (first.status >= 300 && first.status < 400 && first.headers.location) {
                await follow('api final=' + i, first.headers.location);
              }
            }
            await request(api + '/actions/artifacts/' + id, 'DELETE', apiHeaders);
